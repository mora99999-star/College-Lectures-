// ---- إضافة امتحان
function vAdd(){$('#v').innerHTML=`<div class="card"><input id="ti" placeholder="اسم الامتحان"><input id="mn" type="number" placeholder="مدة الامتحان بالدقايق (اختياري)"><input id="mx" type="number" placeholder="أقصى عدد محاولات (اختياري)"><input id="lk" placeholder="رابط المحاضرة (اختياري)"><select id="ct"><option value="">اختار المادة</option>${SUBJ.map(x=>`<option>${x}</option>`).join('')}</select><textarea id="qt" placeholder="الصق الأسئلة هنا..."></textarea><textarea id="kt" style="min-height:70px" placeholder="مفتاح الإجابات: أ ب ج د ... أو 1-ب 2-أ ..."></textarea>
<p class="m">كل سؤال في بلوك: السطر الأول السؤال وتحته الاختيارات (سطر لكل اختيار)، وسطر فاضي بين كل سؤال والتاني. أو الصق الأسئلة بصيغة «1. سؤال / أ) اختيار» ولو بعد الإجابة الصح سطر فيه اسم ملف ينتهي بـ pdf هيتعرف عليها كمفتاح وتسيب خانة المفتاح فاضية. وتقدر تضيف سطر «شرح: ...» تحت أي سؤال يظهر للطالب بعد الإجابة.${S.role=='admin'?' الامتحان هيستنى موافقة المالك.':''}</p><button class="btn" onclick="addEx()">نشر</button></div>`}
function parse(t,k){const M={'أ':0,'ا':0,'ب':1,'ج':2,'د':3,'ه':4,a:0,b:1,c:2,d:3,e:4};
const qs=t.trim().split(/\n\s*\n/).map(b=>b.split('\n').map(s=>s.trim()).filter(Boolean)).filter(b=>b.length>2).map(b=>({q:b[0].replace(/^\d+\s*[.)\-:]\s*/,''),x:(b.slice(1).find(l=>/^(شرح|تفسير)\s*[:：]/.test(l))||'').replace(/^(شرح|تفسير)\s*[:：]\s*/,''),o:b.slice(1).filter(l=>!/^(شرح|تفسير)\s*[:：]/.test(l)).map(s=>s.replace(/^([أابجدهـ]|[a-eA-E]|\d)\s*[).\-:]\s*/,''))}));
const ks=k.trim().split(/[\s,،;]+/).filter(Boolean).map(x=>{x=x.replace(/^\d+[-.:)]+/,'').toLowerCase();return x in M?M[x]:/^\d$/.test(x)?+x-1:-1});return{qs,ks}}
function parse2(t){const qs=[],ks=[];let q=null,m;for(let l of t.split('\n')){l=l.trim();if(!l)continue;
if(/\.pdf$/i.test(l)){if(q&&q.o.length)ks[qs.length-1]=q.o.length-1;continue}
if(m=l.match(/^([أابجدهـ]|[a-e])\s*[).]\s*(.+)/i)){if(q)q.o.push(m[2])}
else if(m=l.match(/^\d+\s*[.)\-]\s*(.+)/)){q={q:m[1],o:[],x:''};qs.push(q)}}
return{qs,ks:qs.map((_,i)=>ks[i]??-1)}}
async function addEx(){let{qs,ks}=parse($('#qt').value,$('#kt').value);if(/\.pdf\s*$/im.test($('#qt').value)||!ks.length){const p=parse2($('#qt').value);if(p.qs.length>=qs.length){qs=p.qs;ks=p.ks}}
if(!qs.length)return toast('مفيش أسئلة صالحة');if(qs.length!=ks.length)return toast(`عدد الأسئلة ${qs.length} ومفتاح الإجابات ${ks.length}`);
const bad=ks.findIndex((x,i)=>x<0||x>=qs[i].o.length);if(bad>=0)return toast('إجابة غلط في سؤال '+(bad+1));
if(await go('exam_add',{ti:$('#ti').value,q:qs,k:ks,m:$('#mn').value,lk:$('#lk').value,ct:$('#ct').value,mx:$('#mx').value})){toast(S.role=='owner'?'اتنشر للطلاب':'اتبعت لموافقة المالك');view='exams';app()}}
// ---- الدرجات والحسابات
async function vScores(){const r=await go('scores');if(!r)return;SC=r.d;hardV();$('#v').innerHTML=`<button class="sm" onclick="csv()">⬇ تصدير CSV</button><div class="card" style="overflow-x:auto"><table><tr><th>الطالب</th><th>الامتحان</th><th>أعلى درجة</th><th>محاولات</th></tr>${r.d.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.title)}</td><td>${x.best}/${x.n}</td><td>${x.tries}</td></tr>`).join('')||'<tr><td class="m">لسه مفيش نتايج</td></tr>'}</table></div>`}
async function vUsers(){const r=await go('users_list');if(!r)return;$('#v').innerHTML=r.d.filter(u=>u.role!='owner').map(u=>`<div class="card row"><div><b>${esc(u.name)}</b> <span class="tag">${u.role=='admin'?'أدمن':'طالب'}</span>${u.on?'':' <span class="tag rejected">موقوف</span>'}</div><div class="acts"><button class="sm" onclick="us('${u.id}','${u.role=='admin'?'student':'admin'}')">${u.role=='admin'?'رجّعه طالب':'رقّيه أدمن'}</button><button class="sm ${u.on?'no':'ok'}" onclick="us('${u.id}','${u.on?'off':'on'}')">${u.on?'إيقاف':'تفعيل'}</button><button class="sm" onclick="us('${u.id}','${u.mu?'unmute':'mute'}')">${u.mu?'إلغاء الكتم':'كتم'}</button><button class="sm" style="background:#111827;color:#fff" onclick="confirm('حذف الحساب ونتايجه ورسايله نهائيًا؟')&&us('${u.id}','delete')">حذف</button></div></div>`).join('')||'<p class="m">مفيش حسابات.</p>';if(S.role!='owner')document.querySelectorAll('#v .acts').forEach(x=>x.remove())}
async function us(i,a){if(await go('user_set',{i,a}))vUsers()}
S?(app(),sync()):authView();
</script></body></html>
