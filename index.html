<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الامتحانات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#d5dce6;--acc:#1b5fa8;--ok:#1f8a4c;--okbg:#e4f5ec;--bad:#c0392b;--badbg:#fbe9e7}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mute:#9aa6bd;--line:#2c3a58;--acc:#5aa2e8;--ok:#4cc585;--okbg:#14302350;--bad:#ef7f72;--badbg:#3a181850}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.8;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:26px;margin:0 0 6px;font-weight:800}
p.sub{color:var(--mute);margin:0 0 14px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:14px}
.q{font-size:20px;font-weight:700;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt:focus-visible,.btn:focus-visible,.tabb:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{color:var(--ink);cursor:default}
.opt:disabled:hover{border-color:var(--line)}
.opt.ok:disabled:hover{border-color:var(--ok)}
.opt.no:disabled:hover{border-color:var(--bad)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--acc);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score{font-size:54px;font-weight:800;margin:6px 0}
.rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.rev .q{font-size:17px;margin-bottom:8px}
.tag{font-size:14px;margin:2px 0}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:#b7791f}
.fb{font-weight:700;margin:6px 0 0;min-height:1.8em}
.hide{display:none}
input,textarea,select{display:block;width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:12px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ex{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.ex .q{font-size:18px;margin-bottom:4px}
.ex .sub{margin:0 0 4px;font-size:15px}
.small{font-size:13px;color:var(--mute);margin:10px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabb{font:inherit;font-weight:700;background:transparent;color:var(--mute);border:0;border-bottom:3px solid transparent;padding:6px 12px;cursor:pointer}
.tabb.on{color:var(--acc);border-color:var(--acc)}
.chat{height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px}
.msg{background:var(--bg);border-radius:10px;padding:6px 10px;margin-bottom:8px}
.msg.me{background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.msg b{font-size:14px;color:var(--acc)}
.msg small{color:var(--mute);margin-inline-start:8px}
.msg p{margin:2px 0;word-break:break-word}
.lbr{display:flex;gap:12px;padding:10px;border-bottom:1px solid var(--line)}
.lbr.me{background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.lbr .n{flex:none;width:36px;font-weight:800}
.lbr .u{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}
</style>
</head>
<body>
<div class="wrap">
 <div id="auth" class="card hide">
  <h1>منصة الامتحانات</h1>
  <p class="sub" id="at">سجّل دخولك عشان نتايجك تتحفظ في حسابك</p>
  <div class="tabs" id="rt"><button class="tabb" data-r="mora">MORA</button><button class="tabb" data-r="adm">أدمن</button><button class="tabb on" data-r="st">طالب</button></div>
  <div class="row" id="mm" style="margin-top:0"><button class="btn" id="tl">دخول</button><button class="btn alt" id="tr">حساب جديد</button></div>
  <input id="un" placeholder="اسمك" autocomplete="username" maxlength="30">
  <input id="pw" type="password" placeholder="الباسورد (6 حروف على الأقل)" autocomplete="current-password">
  <p class="tag bad" id="am"></p>
  <button class="btn" id="ab">دخول</button>
  <p class="small hide" id="first"><a href="#" id="fl" style="color:var(--acc)">أول مرة؟ أنشئ حساب المالك</a></p>
  <p class="small">احفظ الباسورد كويس، مفيش استرجاع تلقائي لو اتنسي.</p>
 </div>
 <div id="main" class="card hide">
  <div class="meta"><span id="hi"></span><button class="btn alt sm" id="out">خروج</button></div>
  <p class="tag bad" id="ban"></p>
  <div class="tabs" id="nav"></div>
  <div id="pane"></div>
 </div>
 <div id="quiz" class="card hide">
  <div class="meta"><span id="cnt"></span><span id="sc"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <p class="q" id="qt"></p>
  <div id="opts"></div>
  <p class="fb" id="fb"></p>
  <div class="row"><button class="btn alt" id="prev">السابق</button><button class="btn" id="next">التالي</button></div>
 </div>
 <div id="res" class="card hide"></div>
</div>
<script>
const SB="https://hryhzqxljdmysqblvjcx.supabase.co",KEY="sb_publishable_Rpl7SpcV4qdufe6hIdkWAA_KiQb9cxJ";

function setMode(m){mode=m;$("tl").classList.toggle("alt",m!=="login");$("tr").classList.toggle("alt",m!=="reg");$("ab").textContent=m==="login"?"دخول":"إنشاء حساب";$("pw").autocomplete=m==="login"?"current-password":"new-password";$("am").textContent=""}

async function submitAuth(){
 let u=$("un").value.trim().replace(/\s+/g," "),p=$("pw").value;const auto=who==="mora"&&$("un").style.display==="none";if(auto){u="MORA";p=OWNER_PASS}

 }catch(x){$("am").className="tag bad";$("am").textContent=arMsg(x.message);if(auto&&/already|Database/i.test(x.message)){$("un").style.display=$("pw").style.display="block";$("am").textContent="حساب MORA موجود بباسورد تاني. اكتبه هنا."}}

async function enter(w){
 show("main");me=null;
 try{me=(await rest("GET","profiles?id=eq."+sess.u+"&select=username,role,suspended"))[0]}catch(e){}

function nav(){

async function loadExams(){exams=await rest("GET","exams?select=id,title,questions,status,creator,created_at&order=created_at.desc")}

 if(tab!=="ex")return;p.textContent="";

 ap.forEach(e=>{

function render(){
 const q=Q[i],done=ans[i]!==undefined;
 $("cnt").textContent="سؤال "+(i+1)+" من "+Q.length;
 $("sc").textContent="تمت الإجابة على "+ans.filter(x=>x!==undefined).length;
 $("pb").style.width=((i+1)/Q.length*100)+"%";
 $("qt").textContent=(i+1)+". "+q.q;$("opts").textContent="";
 q.o.forEach((t,k)=>{
  const b=document.createElement("button");let c="opt";
  if(done){if(k===q.a)c+=" ok";else if(k===ans[i])c+=" no"}
  b.className=c;b.innerHTML="<b>"+L[k]+"</b><span></span>";b.lastChild.textContent=t;

  $("opts").appendChild(b)});
 const f=$("fb");

 $("prev").disabled=i===0;$("next").textContent=i===Q.length-1?"إنهاء وعرض النتيجة":"التالي";$("next").disabled=!done}

 catch(x){st.className="tag bad";st.textContent="تعذر حفظ النتيجة. ";const b=btn("حاول تاني",()=>save(e,a),1,1);st.appendChild(b)}}

 r.appendChild(el("h1",null,e.title));r.appendChild(el("div","score",sc+" / "+qs.length));

function tChat(){

function tAdmin(){

 const p=$("pane"),n=el("div","tabs"),c=el("div"),t=[["add","إضافة امتحان"],["list","الامتحانات"],["sc","الدرجات"]];if(own())t.push(["us","المستخدمين"]);

function parseExam(t,k){
 const ol={"أ":0,"ا":0,"إ":0,"a":0,"ب":1,"b":1,"ج":2,"c":2,"د":3,"d":3},qs=[];let c=null;
 t.split(/\r?\n/).forEach(l=>{

  let m=c&&l.match(/^([أاإبجدabcdABCD])\s*[\)\-\.]\s*(.+)$/);
  if(m){c.o.push(m[2].trim());return}
  m=l.match(/^[\d٠-٩]+\s*[\.\-\)]\s*(.+)$/);
  if(m){c={q:m[1].trim(),o:[]};qs.push(c);return}
  if(c&&!c.o.length)c.q+=" "+l});
 if(!qs.length)return{err:"مش لاقي أسئلة. اكتب كل سؤال برقم (1. 2. ...)"};
 const bad=qs.findIndex(x=>x.o.length<2||x.o.length>4);
 if(bad>=0)return{err:"السؤال رقم "+(bad+1)+" لازم يبقى فيه من 2 لـ 4 اختيارات"};
 const ks=Array.from(k.toLowerCase()).filter(x=>x in ol).map(x=>ol[x]);
 if(ks.length!==qs.length)return{err:"عدد الأسئلة "+qs.length+" وعدد الإجابات "+ks.length};
 return{qs:qs.map((x,j)=>({q:x.q,o:x.o,a:ks[j]}))}}
