<p class="m">كل سؤال في بلوك: السطر الأول السؤال وتحته الاختيارات (سطر لكل اختيار)، وسطر فاضي بين كل سؤال والتاني. أو الصق الأسئلة بصيغة «1. سؤال / أ) اختيار» ولو بعد الإجابة الصح سطر فيه اسم ملف ينتهي بـ pdf هيتعرف عليها كمفتاح وتسيب خانة المفتاح فاضية. وتقدر تضيف سطر «شرح: ...» تحت أي سؤال يظهر للطالب بعد الإجابة.${S.role=='admin'?' الامتحان هيستنى موافقة المالك.':''}</p><button class="btn" onclick="addEx()">نشر</button><div id="st" class="m" style="margin-top:8px;font-weight:700"></div></div>`;if(S.role=='owner')go('admins').then(r=>{if(r)$('#rv').innerHTML+=r.d.map(n=>`<option>${esc(n)}</option>`).join('')})}
function parse(t,k){const M={'أ':0,'ا':0,'ب':1,'ج':2,'د':3,'ه':4,a:0,b:1,c:2,d:3,e:4};
const qs=t.trim().split(/\n\s*\n/).map(b=>b.split('\n').map(s=>s.trim()).filter(Boolean)).filter(b=>b.length>2).map(b=>({q:b[0].replace(/^\d+\s*[.)\-:]\s*/,''),x:(b.slice(1).find(l=>/^(شرح|تفسير)\s*[:：]/.test(l))||'').replace(/^(شرح|تفسير)\s*[:：]\s*/,''),o:b.slice(1).filter(l=>!/^(شرح|تفسير)\s*[:：]/.test(l)).map(s=>s.replace(/^([أابجدهـ]|[a-eA-E]|\d)\s*[).\-:]\s*/,''))}));
const ks=k.trim().split(/[\s,،;]+/).filter(Boolean).map(x=>{x=x.replace(/^\d+[-.:)]+/,'').toLowerCase();return x in M?M[x]:/^\d$/.test(x)?+x-1:-1});return{qs,ks}}
const AL={'أ':0,'ا':0,'إ':0,'ب':1,'ج':2,'د':3,'ه':4,a:0,b:1,c:2,d:3,e:4},ND=t=>t.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function parse2(t){const qs=[],ks=[];let q=null,m;for(let l of t.split('\n')){l=l.trim();if(!l)continue;
if(/\.pdf$/i.test(l)){if(q&&q.o.length)ks[qs.length-1]=q.o.length-1;continue}
if(m=l.match(/^(?:الإجابة|الاجابة|الإجابه|الاجابه|answer)\s*(?:الصحيحة|الصحيحه)?\s*[:：\-]\s*(\S+)/i)){const k=AL[m[1][0].toLowerCase()];if(q&&k!=null)ks[qs.length-1]=k;continue}
if(m=l.match(/^(?:شرح|تفسير)\s*[:：]\s*(.+)/)){if(q)q.x=m[1];continue}
if(m=l.match(/^([أابجدهـإ]|[a-e])\s*[).\-:]\s*(.+)/i)){if(q){const ok=/[✔✅]|\*\s*$/.test(m[2]);q.o.push(m[2].replace(/[✔✅]|\*\s*$/g,'').trim());if(ok)ks[qs.length-1]=q.o.length-1}}
else if(m=l.match(/^\d+\s*[.)\-]\s*(.+)/)){q={q:m[1],o:[],x:''};qs.push(q)}}
return{qs,ks:qs.map((_,i)=>ks[i]??-1)}}
async function addEx(){const st=$('#st'),say=(m,c)=>{st.textContent=m;st.style.color=c||'var(--m)'},bt=document.querySelector('#v .btn');
try{const T=ND($('#qt').value).replace(/\\([^\w\s])/g,'$1').replace(/^[ \t]*[-*•][ \t]+/gm,'').replace(/\*\*/g,''),K=ND($('#kt').value).replace(/(\d+)\s+([أابجدهإa-e])(?![\u0621-\u064Aa-z])/gi,'$1-$2');
if(!$('#ti').value.trim())return say('❌ اكتب اسم الامتحان الأول','var(--no)');
const p1=parse(T,K),p2=parse2(T),kt=K.trim()?K.trim().split(/[\s,،;]+/).filter(Boolean).map(x=>{x=x.replace(/^\d+[-.:)]+/,'').toLowerCase();return x in AL?AL[x]:/^\d$/.test(x)?+x-1:-1}):[];
const ok=c=>c.qs.length&&c.ks.length==c.qs.length&&c.qs.every((q,i)=>q.o.length>=2&&c.ks[i]>=0&&c.ks[i]<q.o.length);
const c=(p2.qs.length>p1.qs.length?[{qs:p2.qs,ks:kt},{qs:p2.qs,ks:p2.ks}]:[{qs:p1.qs,ks:kt},{qs:p2.qs,ks:kt},{qs:p2.qs,ks:p2.ks}]).find(ok);
if(!c)return say(`❌ مقدرتش أقرا الأسئلة: فهمت ${Math.max(p1.qs.length,p2.qs.length)} سؤال، ومفتاح الإجابات ${kt.length||p2.ks.filter(x=>x>=0).length}. اتأكد إن كل سؤال مرقم (1.) وكل اختيار بيبدأ بـ أ) ب) ج) د)، وإن عدد الإجابات بنفس عدد الأسئلة وكل واحدة منهم أ أو ب أو ج أو د.`,'var(--no)');
say(`⏳ فهمت ${c.qs.length} سؤال، جاري الحفظ...`);bt.disabled=true;
const P={ti:$('#ti').value,q:c.qs,k:c.ks,m:$('#mn').value,lk:$('#lk').value,ct:$('#ct').value,mx:$('#mx').value,ot:tm('#ot'),cl:tm('#cl'),rv:$('#rv')?$('#rv').value:''};
if(await(EDIT?go('exam_edit',{i:EDIT,...P}):go('exam_add',P))){EDIT=0;toast(S.role=='owner'?(P.rv?'اتبعت للأدمن للمراجعة':'اتنشر للطلاب'):'اتبعت لموافقة المالك');view='exams';app()}
else{say('❌ الحفظ فشل: '+(window.lastErr||'مشكلة في الاتصال'),'var(--no)');bt.disabled=false}}
catch(e){say('❌ خطأ في الصفحة: '+e.message,'var(--no)');if(bt)bt.disabled=false}}

S?(app(),sync()):authView();
