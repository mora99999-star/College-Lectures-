<script>
// ===== JSONBin: الصق مفتاحك هنا (يفضّل Access Key صلاحياته Read + Update على الـ Bin ده بس) =====
const KEY='$2a$10$pypH/z55j1WzFK/cD2H1neDDB04D6O23tcLyyG4AAh4DaXzhqxfuu',KH='X-Access-Key',BIN='6ae2ad12ac6210605a5ac66d',LB_BIN='';// حط هنا Bin ID بتاع الأوائل  // لو بتستعمل Access Key غيّر KH إلى 'X-Access-Key'
// ==========================================================================================
let dirty=0,last=0;const DB={u:[],e:[],a:[],c:[],n:1},sv=()=>{dirty=1},nid=()=>DB.n++;
const H=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mq'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return'p'+s}};
const U=(t,r)=>{const u=DB.u.find(x=>x.id==t&&x.on);if(!u)throw Error('سجّل دخول من جديد');if(r&&!r.includes(u.role))throw Error('غير مسموح');return u};
const done0=0;const nm=id=>(DB.u.find(x=>x.id==id)||{}).name,ex_=i=>DB.e.find(x=>x.id==i),done=u=>DB.a.filter(a=>a.uid==u&&a.done&&!a.p);
const L={
async login({n,p,tab}){const h=await H(p),u=DB.u.find(x=>x.name.toLowerCase()==n.trim().toLowerCase()&&x.pass==h&&x.role==tab);if(!u)throw Error('بيانات غير صحيحة');if(!u.on)throw Error('الحساب موقوف');return{t:u.id,name:u.name,role:u.role,ph:u.ph||''}},
async signup({n,p}){n=n.trim();if(n.length<3||p.length<4)throw Error('الاسم 3 حروف والباسورد 4 على الأقل');if(DB.u.some(x=>x.name.toLowerCase()==n.toLowerCase())||/^(ad|ow)-/i.test(n))throw Error('الاسم مستخدم');
DB.u.push({id:'u'+nid(),name:n,pass:await H(p),role:'student',on:true});sv();return L.login({n,p,tab:'student'})},
exams_list({t}){const u=U(t),d=done(u.id);return DB.e.filter(e=>u.role=='owner'||e.status=='approved'||e.author==u.id).map(e=>{const m=d.filter(a=>a.exam==e.id);return{id:e.id,title:e.title,n:e.qs.length,status:e.status,by:nm(e.author),best:m.length?Math.max(...m.map(a=>a.score)):null,tries:m.length,cat:e.cat,m:e.m,lk:e.lk,mx:e.mx}}).reverse()},
exam_get({t,i}){const u=U(t),e=ex_(i);if(!e||!(u.role=='owner'||e.status=='approved'||e.author==u.id))throw Error('الامتحان مش موجود');return{title:e.title,m:e.m,qs:e.qs,key:u.role=='owner'||(u.role=='admin'&&e.author==u.id)?e.key:null}},
exam_add({t,ti,q,k,m,lk,mx,ct}){const u=U(t,['owner','admin']);if(!q.length||q.length!=k.length||!ti.trim())throw Error('الأسئلة والمفتاح مش متطابقين');DB.e.push({id:nid(),title:ti.trim(),qs:q,key:k,cat:(ct||'').trim().slice(0,30),m:+m||0,lk:/^https?:\/\//.test(lk||'')?lk:'',mx:+mx||0,status:u.role=='owner'?'approved':'pending',author:u.id});sv()},
exam_set({t,i,a}){U(t,['owner']);if(a=='delete'){DB.e=DB.e.filter(e=>e.id!=i);DB.a=DB.a.filter(x=>x.exam!=i)}else ex_(i).status=a=='approve'?'approved':'rejected';sv()},
att_start({t,i,p}){const u=U(t,['student']),e=ex_(i);if(!e||e.status!='approved')throw Error('الامتحان مش متاح');if(e.mx&&done(u.id).filter(a=>a.exam==i).length>=e.mx)throw Error('خلصت عدد المحاولات');DB.a=DB.a.filter(x=>x.done||Date.now()-x.created<216e5);const id=nid();DB.a.push({id,uid:u.id,exam:i,ans:{},done:false,p:!!p,created:Date.now()});sv();return id},
att_ans({t,a,qi,c}){const u=U(t,['student']),x=DB.a.find(z=>z.id==a&&z.uid==u.id&&!z.done);if(!x)throw Error('محاولة غير صالحة');if(qi in x.ans)throw Error('السؤال اتجاوب قبل كده');x.ans[qi]=c;sv();return ex_(x.exam).key[qi]},
att_end({t,a}){const u=U(t,['student']),x=DB.a.find(z=>z.id==a&&z.uid==u.id&&!z.done);if(!x)throw Error('محاولة غير صالحة');const k=ex_(x.exam).key;x.score=Object.entries(x.ans).filter(([q,c])=>k[q]==c).length;x.total=k.length;x.done=true;sv();return{s:x.score,n:x.total,id:a}},
my_results({t}){const u=U(t);return done(u.id).map(a=>({id:a.id,exam:a.exam,title:ex_(a.exam).title,s:a.score,n:a.total,d:a.created})).reverse()},
att_review({t,a}){const u=U(t),x=DB.a.find(z=>z.id==a&&z.uid==u.id&&z.done);if(!x)return null;const e=ex_(x.exam);return{title:e.title,qs:e.qs,key:e.key,ans:x.ans}},
lbc(i){const b={};DB.a.filter(a=>a.done&&!a.p&&(i==null||a.exam==i)).forEach(a=>{const k=a.uid+'_'+a.exam;b[k]=Math.max(b[k]||0,a.score)});const s={};
Object.entries(b).forEach(([k,v])=>{const u=DB.u.find(x=>x.id==k.split('_')[0]);if(u&&u.role=='student'&&u.on){const r=s[u.name]||(s[u.name]={name:u.name,s:0,ph:u.ph||''});r.s+=v}});return Object.values(s).sort((x,y)=>y.s-x.s||x.name.localeCompare(y.name)).slice(0,10)},
async lb({i}){if(!LB_BIN)return L.lbc(i);const r=await fetch(LB+'/latest',{headers:hd()});if(!r.ok)throw Error('مشكلة في بن الأوائل ('+r.status+')');const o=await r.json(),l=i==null?o.t:(o.e[i]||[]);return l.map(x=>({...x,ph:(o.p||{})[x.name]||''}))},
async pw({t,o,n}){const u=U(t);if(u.pass!=await H(o))throw Error('الباسورد الحالي غلط');if(n.length<4)throw Error('الباسورد قصير');u.pass=await H(n);sv()},
bw_set({t,m}){U(t,['owner']);DB.bw=m.trim().slice(0,500);sv()},
hard({t}){U(t,['owner','admin']);const g={};DB.a.filter(a=>a.done&&!a.p).forEach(a=>{const e=ex_(a.exam);if(!e)return;Object.entries(a.ans).forEach(([q,c])=>{const k=e.title+'|'+q,r=g[k]||(g[k]={title:e.title,q:(e.qs[q]||{}).q,w:0,n:0});r.n++;if(e.key[q]!=c)r.w++})});return Object.values(g).filter(r=>r.w).sort((x,y)=>y.w/y.n-x.w/x.n||y.n-x.n).slice(0,8)},
me({t}){const u=U(t);return{role:u.role}},
ann_get({t}){U(t);return DB.ann||''},ann_set({t,m}){U(t,['owner']);DB.ann=m.trim().slice(0,300);sv()},
scores({t}){U(t,['owner','admin']);const g={};DB.a.filter(a=>a.done&&!a.p).forEach(a=>{const e=ex_(a.exam),k=nm(a.uid)+'|'+e.title,r=g[k]||(g[k]={name:nm(a.uid),title:e.title,best:0,n:a.total,tries:0});r.best=Math.max(r.best,a.score);r.tries++});return Object.values(g).sort((x,y)=>x.name.localeCompare(y.name))},
users_list({t}){const me=U(t,['owner','admin']);return DB.u.filter(u=>me.role=='owner'||u.role=='student').map(u=>({id:u.id,name:u.name,role:u.role,on:u.on,mu:u.mu}))},
user_set({t,i,a}){U(t,['owner']);const u=DB.u.find(x=>x.id==i);if(!u||u.role=='owner')throw Error('مينفعش');if(a=='delete'){DB.u=DB.u.filter(x=>x.id!=i);DB.a=DB.a.filter(x=>x.uid!=i);DB.c=DB.c.filter(x=>x.uid!=i)}else if(a=='mute'||a=='unmute')u.mu=a=='mute';else if(a=='admin'||a=='student')u.role=a;else u.on=a=='on';sv()},
set_photo({t,ph}){const u=U(t,['student']);if(!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(ph)||ph.length>60000)throw Error('الصورة مش مقبولة');u.ph=ph;sv()},
chat_get({t}){U(t);return DB.c.slice(-80).reverse().map(m=>{const u=DB.u.find(x=>x.id==m.uid)||{};return{id:m.id,uid:m.uid,name:u.name||'؟',role:u.role,msg:m.msg}})},
chat_send({t,m}){const u=U(t);if(u.mu)throw Error('انت مكتوم');m=m.trim();(DB.bw||'').split(/[\s,،]+/).filter(Boolean).forEach(w=>m=m.split(w).join('***'));if(m&&m.length<=500){DB.c.push({id:nid(),uid:u.id,msg:m});DB.c=DB.c.slice(-200);sv()}},
chat_del({t,i}){const u=U(t);DB.c=DB.c.filter(m=>!(m.id==i&&(m.uid==u.id||u.role!='student')));sv()}};
const BASE='https://api.jsonbin.io/v3/b/'+BIN,LB='https://api.jsonbin.io/v3/b/'+LB_BIN,hd=()=>({'Content-Type':'application/json',[KH]:KEY,'X-Bin-Meta':'false'});
async function pull(force){if(!KEY.startsWith('$2'))throw Error('حط مفتاح JSONBin في أول الملف');if(!force&&Date.now()-last<3000)return;
const r=await fetch(BASE+'/latest',{headers:hd()});if(!r.ok)throw Error(r.status==401||r.status==403?'مفتاح JSONBin غلط أو من غير صلاحية':'مشكلة في الاتصال بالتخزين ('+r.status+')');
const j=await r.json();for(const k in DB)delete DB[k];Object.assign(DB,{u:[],e:[],a:[],c:[],n:1},j);last=Date.now()}
async function push(){const r=await fetch(BASE,{method:'PUT',headers:hd(),body:JSON.stringify(DB)});if(!r.ok)throw Error('فشل الحفظ ('+r.status+')');last=Date.now()}
async function seed(){if(!DB.u.some(u=>u.role=='owner')){DB.u.push({id:'o1',name:'MORA',pass:await H('MORA220'),role:'owner',on:true});dirty=1}}
const W=new Set(['signup','exam_add','exam_set','att_start','att_ans','att_end','user_set','set_photo','chat_send','chat_del','pw','ann_set','bw_set']);const LBW=new Set(['att_end','set_photo','exam_set','user_set']);let qq=Promise.resolve();
async function lbPush(){const o={t:[],e:{},p:{}},f=l=>l.map(x=>{if(x.ph)o.p[x.name]=x.ph;return{name:x.name,s:x.s}});o.t=f(L.lbc(null));DB.e.filter(e=>e.status=='approved').forEach(e=>o.e[e.id]=f(L.lbc(e.id)));
const r=await fetch(LB,{method:'PUT',headers:hd(),body:JSON.stringify(o)});if(!r.ok)throw Error('فشل حفظ الأوائل ('+r.status+')')}
function api(f,a){if(f=='lb'&&LB_BIN)return L.lb(a);const r=qq.then(async()=>{await pull(W.has(f));await seed();const x=await L[f](a);if(dirty){dirty=0;try{await push()}catch(e){last=0;throw e}if(LB_BIN&&LBW.has(f))try{await lbPush()}catch(e){toast(e.message)}}return x});qq=r.catch(()=>{});return r}
let S=JSON.parse(localStorage.getItem('S')||'null'),tab='student',mode='in',view='exams',ex=null,poll=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=d=>new Date(d).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3000)}
async function go(f,a={},noT){try{return{d:await api(f,noT?a:{t:S&&S.t,...a})}}catch(e){if(e.message.includes('سجّل دخول'))out();else toast(e.message);return null}}
function out(){S=null;localStorage.removeItem('S');clearInterval(poll);authView()}
function authView(){$('#app').innerHTML=`<div class="auth card"><h1>College Lectures📝</h1><div class="tabs">${[['owner','MORA'],['admin','أدمن'],['student','طالب']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';authView()">${l}</button>`).join('')}</div>
<input id="n" placeholder="الاسم" autocomplete="username"><input id="p" type="password" placeholder="الباسورد" autocomplete="current-password" onkeydown="event.key=='Enter'&&sub()">
<button class="btn" onclick="sub()">${tab=='student'&&mode=='up'?'إنشاء حساب':'دخول'}</button>
${tab=='student'?`<p class="m" style="text-align:center;cursor:pointer" onclick="mode=mode=='in'?'up':'in';authView()">${mode=='in'?'معندكش حساب؟ سجّل جديد':'عندك حساب؟ ادخل'}</p>`:''}</div>`}

function bd(a){if(!a.length)return'';const D=new Set(a.map(x=>new Date(x.d).toDateString()));let st=0,d=new Date();if(!D.has(d.toDateString()))d.setDate(d.getDate()-1);while(D.has(d.toDateString())){st++;d.setDate(d.getDate()-1)}

return`<div class="card">🔥 ${st} يوم متتالي<div class="acts" style="margin-top:6px">${b.map(x=>`<span class="tag">${x[0]} ${x[1]}</span>`).join('')}</div></div>`}

async function vExams(){const[r,an]=await Promise.all([go('exams_list'),go('ann_get')]);if(!r)return;localStorage.setItem('seen',Math.max(0,...r.d.map(e=>e.id)));const o=S.role=='owner',st=S.role=='student';
$('#v').innerHTML=(an&&an.d?`<div class="card" style="border-color:var(--p)">📢 ${esc(an.d)}</div>`:'')+(o?'<button class="sm" onclick="ann()">📢 إعلان</button>':'')+(cats(r.d).length?`<select onchange="cf=this.value;vExams()"><option value="">كل المواد</option>${cats(r.d).map(c=>`<option ${c==cf?'selected':''}>${esc(c)}</option>`).join('')}</select>`:'')+(r.d.length?r.d.filter(e=>!cf||e.cat==cf).map(e=>`<div class="card row"><div><b>${esc(e.title)}</b><div class="m">${e.n} سؤال${e.cat?' • '+esc(e.cat):''}${e.m?' • ⏱ '+e.m+' د':''}${e.mx?' • أقصى '+e.mx+' محاولة':''}${!st&&e.by?' • '+esc(e.by):''}${e.best!=null?` • أعلى درجة ${e.best}/${e.n} (${e.tries} محاولة)`:''}</div></div><div class="acts">
${e.status!='approved'?`<span class="tag ${e.status}">${e.status=='pending'?'منتظر الموافقة':'مرفوض'}</span>`:''}
${st?`<button class="btn" onclick="start(${e.id})">${e.tries?'حاول تاني':'ابدأ'}</button><button class="sm" onclick="start(${e.id},1)">تدريب</button>`:`<button class="sm" onclick="prev(${e.id})">معاينة</button>`}
${e.lk?`<a class="sm" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(e.lk)}">📎 المحاضرة</a>`:''}${o&&e.status!='approved'?`<button class="sm ok" onclick="act(${e.id},'approve')">اعتماد</button>`:''}${o&&e.status=='pending'?`<button class="sm" onclick="act(${e.id},'reject')">رفض</button>`:''}${o?`<button class="sm no" onclick="confirm('حذف الامتحان وكل نتايجه؟')&&act(${e.id},'delete')">حذف</button>`:''}</div></div>`).join(''):'<p class="m">مفيش امتحانات لسه.</p>')}
async function act(i,a){if(await go('exam_set',{i,a}))vExams()}
async function start(i,p){const[a,b]=await Promise.all([go('exam_get',{i}),go('att_start',{i,p})]);if(!a||!b)return;if(ex)clearInterval(ex.tm);const sh=z=>z.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
ex={att:b.d,title:a.d.title,qs:sh(a.d.qs.map((x,qi)=>{const oi=sh(x.o.map((_,j)=>j));return{q:x.q,x:x.x,o:oi.map(j=>x.o[j]),qi,oi}})),i:0,end:a.d.m&&!p?Date.now()+a.d.m*6e4:0};if(ex.end)ex.tm=setInterval(tick,1000);q()}
function tick(){const t=$('#tm');if(!t||!ex)return clearInterval(ex&&ex.tm);const s=Math.max(0,Math.round((ex.end-Date.now())/1e3));t.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(ex.tm);toast('الوقت خلص');fin()}}
function q(){const x=ex.qs[ex.i];$('#v').innerHTML=`<div class="card"><div class="m">${esc(ex.title)} — سؤال ${ex.i+1} من ${ex.qs.length} ${ex.end?'<span id="tm" class="tag"></span>':''}</div><div class="bar"><i style="width:${ex.i/ex.qs.length*100}%"></i></div><h3>${esc(x.q)}</h3>${x.o.map((o,j)=>`<button class="opt" id="o${j}" onclick="pick(${j})">${esc(o)}</button>`).join('')}<div id="nx"></div></div>`;if(ex.end)tick()}
async function pick(j){if(ex.lock)return;ex.lock=1;const x=ex.qs[ex.i],r=await go('att_ans',{a:ex.att,qi:x.qi,c:x.oi[j]});if(!r){ex.lock=0;return}const k=x.oi.indexOf(r.d);bp(j==k?660:220);ex.cur={q:x.q,a:x.o[k],t:ex.title,x:x.x};
document.querySelectorAll('.opt').forEach(b=>b.disabled=true);$('#o'+k).classList.add('ok');if(j!=k)$('#o'+j).classList.add('no');ex.lock=0;
const l=ex.i==ex.qs.length-1;$('#nx').innerHTML=(x.x?`<p class="m">💡 ${esc(x.x)}</p>`:'')+`<button class="sm" onclick="fv()">⭐ احفظ السؤال</button> `+`<button class="btn" onclick="${l?'fin()':'ex.i++;q()'}">${l?'إنهاء وعرض النتيجة':'التالي'}</button>`}
async function fin(){clearInterval(ex.tm);const r=await go('att_end',{a:ex.att});if(!r)return;const{s,n,id}=r.d;
$('#v').innerHTML=`<div class="card" style="text-align:center"><div class="m">نتيجتك</div><div class="ring" style="background:conic-gradient(var(--p) ${s/n*100}%,var(--b) 0)"><span>${Math.round(s/n*100)}%</span></div><div class="big">${s} / ${n}</div><div class="acts" style="justify-content:center;margin-top:12px"><button class="btn" onclick="rev(${id})">مراجعة الإجابات</button><button class="sm" onclick="view='exams';app()">رجوع</button></div></div>`;if(s/n>=.8)conf()}
const revH=(d,w)=>d.qs.map((x,n)=>{const c=(d.ans||{})[n];if(w&&c==d.key[n])return'';return`<div class="card"><b>${n+1}. ${esc(x.q)}</b>${x.o.map((o,j)=>`<div class="opt ${j==d.key[n]?'ok':j==c?'no':''}">${esc(o)}${j==c?' ← إجابتك':''}</div>`).join('')}${x.x?`<div class="m">💡 ${esc(x.x)}</div>`:''}${c==null&&d.ans?'<div class="m">مجاوبتش</div>':''}</div>`}).join('');
async function rev(a,w){const r=await go('att_review',{a});if(r&&r.d)$('#v').innerHTML=`<h3>${esc(r.d.title)}</h3>`+`<button class="sm" onclick="rev(${a},${w?0:1})">${w?'كل الأسئلة':'الأخطاء بس'}</button>`+revH(r.d,w)+`<button class="sm" onclick="view='mine';app()">رجوع</button>`}
async function prev(i){const r=await go('exam_get',{i});if(r)$('#v').innerHTML=`<h3>${esc(r.d.title)}</h3>`+revH({...r.d,ans:null})+`<button class="sm" onclick="app()">رجوع</button>`}

async function cl(){const r=await go('chat_get');const b=$('#cl');if(!r||!b)return;const dn=b.scrollHeight-b.scrollTop-b.clientHeight<60||!b.children.length,adm=S.role!='student';

function vAdd(){$('#v').innerHTML=`<div class="card"><input id="ti" placeholder="اسم الامتحان"><input id="mn" type="number" placeholder="مدة الامتحان بالدقايق (اختياري)"><input id="mx" type="number" placeholder="أقصى عدد محاولات (اختياري)"><input id="lk" placeholder="رابط المحاضرة (اختياري)"><input id="ct" placeholder="المادة أو الدكتور (اختياري)"><textarea id="qt" placeholder="الصق الأسئلة هنا..."></textarea><textarea id="kt" style="min-height:70px" placeholder="مفتاح الإجابات: أ ب ج د ... أو 1-ب 2-أ ..."></textarea>
<p class="m">كل سؤال في بلوك: السطر الأول السؤال وتحته الاختيارات (سطر لكل اختيار)، وسطر فاضي بين كل سؤال والتاني. وتقدر تضيف سطر «شرح: ...» تحت أي سؤال يظهر للطالب بعد الإجابة.${S.role=='admin'?' الامتحان هيستنى موافقة المالك.':''}</p><button class="btn" onclick="addEx()">نشر</button></div>`}
function parse(t,k){const M={'أ':0,'ا':0,'ب':1,'ج':2,'د':3,'ه':4,a:0,b:1,c:2,d:3,e:4};
const qs=t.trim().split(/\n\s*\n/).map(b=>b.split('\n').map(s=>s.trim()).filter(Boolean)).filter(b=>b.length>2).map(b=>({q:b[0].replace(/^\d+\s*[.)\-:]\s*/,''),x:(b.slice(1).find(l=>/^(شرح|تفسير)\s*[:：]/.test(l))||'').replace(/^(شرح|تفسير)\s*[:：]\s*/,''),o:b.slice(1).filter(l=>!/^(شرح|تفسير)\s*[:：]/.test(l)).map(s=>s.replace(/^([أابجدهـ]|[a-eA-E]|\d)\s*[).\-:]\s*/,''))}));
const ks=k.trim().split(/[\s,،;]+/).filter(Boolean).map(x=>{x=x.replace(/^\d+[-.:)]+/,'').toLowerCase();return x in M?M[x]:/^\d$/.test(x)?+x-1:-1});return{qs,ks}}
async function addEx(){const{qs,ks}=parse($('#qt').value,$('#kt').value);
if(!qs.length)return toast('مفيش أسئلة صالحة');if(qs.length!=ks.length)return toast(`عدد الأسئلة ${qs.length} ومفتاح الإجابات ${ks.length}`);
const bad=ks.findIndex((x,i)=>x<0||x>=qs[i].o.length);if(bad>=0)return toast('إجابة غلط في سؤال '+(bad+1));
if(await go('exam_add',{ti:$('#ti').value,q:qs,k:ks,m:$('#mn').value,lk:$('#lk').value,ct:$('#ct').value,mx:$('#mx').value})){toast(S.role=='owner'?'اتنشر للطلاب':'اتبعت لموافقة المالك');view='exams';app()}}

S?(app(),sync()):authView();
